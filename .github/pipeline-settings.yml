# Settings for the shared standard pipeline from UKHSA-Internal/devops-pipeline.
# Consumed by .github/workflows/devops-pipeline-standard.yml.
version: "1.1"

service:
  name: data-dashboard-api
  owner_team: data-dashboard-engineers
  language: python
  test:
    # Runs at the start of each suite job and of the final step.
    setup: ". ./uhd.sh && uhd venv create"
    # Each suite runs as its own job, in parallel. Unit, integration and system
    # record coverage data for the final step, as actions.yml does.
    suites:
      - name: unit
        command: ". ./uhd.sh && export COVERAGE_FILE=.coverage.unit && uhd tests unit --cov --cov-fail-under=0 --junitxml=test-results/unit.xml"
      - name: integration
        command: ". ./uhd.sh && export COVERAGE_FILE=.coverage.integration && uhd tests integration --cov --cov-fail-under=0 --junitxml=test-results/integration.xml"
      - name: system
        command: ". ./uhd.sh && export COVERAGE_FILE=.coverage.system && uhd tests system --cov --cov-fail-under=0 --junitxml=test-results/system.xml"
      - name: migrations
        command: ". ./uhd.sh && uhd tests migrations --junitxml=test-results/migrations.xml"
    collect: [".coverage.*"]
    # Combines the suites' coverage data and enforces the threshold, without re-running tests.
    final:
      name: coverage
      command: ". ./uhd.sh && uhd tests coverage-report"

environments:
  - name: dev
    category: Development
    account_id: "111111111111"
    role_name: data-dashboard-api-dev-deploy-role
    region: eu-west-2
  - name: staging
    category: Pre-production
    account_id: "222222222222"
    role_name: data-dashboard-api-preprod-deploy-role
    region: eu-west-2
  - name: prod
    category: Production
    account_id: "333333333333"
    role_name: data-dashboard-api-prod-deploy-role
    region: eu-west-2

governance:
  retention_days: 30
  approvers:
    - data-dashboard-engineers

verification:
  health_endpoint: /health
  timeout_seconds: 60
  db_check_required: false

deploy:
  production:
    approval_mode: all-approvers